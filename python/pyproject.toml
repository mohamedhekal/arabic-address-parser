[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-address-parser"
version = "0.1.0"
description = "Normalize, parse and compare Arabic and Franco-Arabic addresses (Egypt and the Gulf)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["arabic", "address", "parser", "geocoding", "nlp", "egypt", "gulf"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Arabic",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
arabic-address-parser = "arabic_address_parser.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
